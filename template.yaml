AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Waste2Value — Circular Intelligence & Verification Platform
  Serverless MVP: FastAPI on Lambda, S3 Evidence Storage, DynamoDB Single Table,
  AWS KMS Asymmetric Signatures, Amazon Textract OCR, Amazon Bedrock Agent.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        STAGE: !Ref Stage
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        REGISTRY_TABLE: !Ref RegistryTable
        KMS_KEY_ARN: !GetAtt PassportSigningKey.Arn
        POWERTOOLS_SERVICE_NAME: Waste2ValueCore

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment stage.

Resources:
  # ============================================================================
  # 1. STORAGE: S3 Evidence Dossier Bucket
  # ============================================================================
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'w2v-evidence-${Stage}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldEvidenceToGlacier
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER

  # ============================================================================
  # 2. PERSISTENCE: DynamoDB Registry Table (Single Table Design)
  # ============================================================================
  RegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'w2v-registry-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ============================================================================
  # 3. CRYPTOGRAPHY: AWS KMS Asymmetric Digital Signing Key
  # ============================================================================
  PassportSigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Asymmetric RSA_4096 signing key for authoritative Circularity Passports (RSASSA_PSS_SHA_256).
      KeySpec: RSA_4096
      KeyUsage: SIGN_VERIFY
      MultiRegion: false
      EnableKeyRotation: false # Asymmetric keys do not support automatic rotation; versioned manually
      KeyPolicy:
        Version: '2012-10-17'
        Id: PassportSigningKeyPolicy
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowLambdaSign
            Effect: Allow
            Principal:
              AWS: !GetAtt ApiFunctionRole.Arn
            Action:
              - 'kms:Sign'
              - 'kms:GetPublicKey'
              - 'kms:DescribeKey'
            Resource: '*'

  PassportSigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/w2v-passport-signer-${Stage}'
      TargetKeyId: !Ref PassportSigningKey

  # ============================================================================
  # 4. COMPUTE: FastAPI Serverless API Function
  # ============================================================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.main.handler
      Role: !GetAtt ApiFunctionRole.Arn
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Waste2ValueServiceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt EvidenceBucket.Arn
                  - !Sub '${EvidenceBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt RegistryTable.Arn
                  - !Sub '${RegistryTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - textract:AnalyzeDocument
                  - textract:DetectDocumentText
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0'

  # ============================================================================
  # 5. ORCHESTRATION: Step Functions Verification State Machine
  # ============================================================================
  VerificationWorkflowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'w2v-verification-pipeline-${Stage}'
      DefinitionSubstitutions:
        ApiFunctionArn: !GetAtt ApiFunction.Arn
      Definition:
        Comment: "End-to-End E-Waste Documentary Verification & Passport Issuance Pipeline"
        StartAt: IngestAndNormalize
        States:
          IngestAndNormalize:
            Type: Task
            Resource: !GetAtt ApiFunction.Arn
            Parameters:
              Action: "NORMALIZE_CONSIGNMENT"
              Payload.$: "$"
            Next: RunDocumentAIOCR
          RunDocumentAIOCR:
            Type: Task
            Resource: !GetAtt ApiFunction.Arn
            Parameters:
              Action: "EXTRACT_EVIDENCE_TEXTRACT"
              Payload.$: "$"
            Next: EvaluateDeterministicRules
          EvaluateDeterministicRules:
            Type: Task
            Resource: !GetAtt ApiFunction.Arn
            Parameters:
              Action: "EVALUATE_RULES"
              Payload.$: "$"
            Next: CheckVerificationStatus
          CheckVerificationStatus:
            Type: Choice
            Choices:
              - Variable: "$.status"
                StringEquals: "SUPPORTED"
                Next: IssueKmsSignedPassport
            Default: FlagAuditorReview
          IssueKmsSignedPassport:
            Type: Task
            Resource: !GetAtt ApiFunction.Arn
            Parameters:
              Action: "SIGN_CIRCULARITY_PASSPORT"
              Payload.$: "$"
            End: true
          FlagAuditorReview:
            Type: Task
            Resource: !GetAtt ApiFunction.Arn
            Parameters:
              Action: "ESCALATE_AUDITOR_REVIEW"
              Payload.$: "$"
            End: true

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL for Waste2Value REST Core
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  EvidenceBucketName:
    Description: S3 Evidence dossier storage bucket
    Value: !Ref EvidenceBucket
  DynamoDBTableName:
    Description: Single-table persistence registry
    Value: !Ref RegistryTable
  KmsSigningKeyArn:
    Description: AWS KMS Asymmetric RSA-4096 signing key ARN
    Value: !GetAtt PassportSigningKey.Arn
